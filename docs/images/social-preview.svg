<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">iOS Architecture Reference</title>
  <desc id="description">Real SwiftUI architecture, explained by the code. A five-step hierarchy from the app composition root to a feature graph.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#6E6E73"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#FAF9F6"/>
  <rect x="28" y="28" width="1224" height="584" rx="28" fill="none" stroke="#6E6E73" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="104" fill="#005EB8" font-size="20" font-weight="700" letter-spacing="2">REAL CODE · SWIFTUI</text>

    <text x="72" y="194" fill="#050505" font-size="64" font-weight="750" letter-spacing="-2">
      <tspan x="72" dy="0">iOS Architecture</tspan>
      <tspan x="72" dy="72">Reference</tspan>
    </text>

    <text x="72" y="338" fill="#050505" font-size="25" font-weight="500">
      <tspan x="72" dy="0">Real SwiftUI architecture,</tspan>
      <tspan x="72" dy="36">explained by the code</tspan>
    </text>

    <g font-size="18" font-weight="650">
      <rect x="72" y="438" width="132" height="48" rx="24" fill="#E6F2FF"/>
      <text x="138" y="469" fill="#005EB8" text-anchor="middle">LAYERED</text>

      <rect x="218" y="438" width="108" height="48" rx="24" fill="#E6F2FF"/>
      <text x="272" y="469" fill="#005EB8" text-anchor="middle">MVVM</text>

      <rect x="340" y="438" width="194" height="48" rx="24" fill="#E6F2FF"/>
      <text x="437" y="469" fill="#005EB8" text-anchor="middle">TYPED ROUTING</text>
    </g>

    <text x="72" y="552" fill="#6E6E73" font-size="19" font-weight="600">Single app target · Manual factory-based DI</text>

    <g aria-label="Hierarchical composition root diagram">
      <text x="940" y="84" fill="#6E6E73" font-size="17" font-weight="700" letter-spacing="1.5" text-anchor="middle">COMPOSITION ROOT</text>

      <path d="M 940 164 L 940 180" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 940 250 L 940 266" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 940 336 L 940 352" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 940 422 L 940 438" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="770" y="104" width="340" height="60" rx="18" fill="#0066CC"/>
      <text x="940" y="141" fill="#FFFFFF" font-size="23" font-weight="700" text-anchor="middle">ArquitecturaApp</text>

      <rect x="770" y="190" width="340" height="60" rx="18" fill="#E6F2FF" stroke="#005EB8" stroke-width="2"/>
      <text x="940" y="227" fill="#005EB8" font-size="22" font-weight="700" text-anchor="middle">Dependencies · AppRouter</text>

      <rect x="770" y="276" width="340" height="60" rx="18" fill="#FAF9F6" stroke="#6E6E73" stroke-width="2"/>
      <text x="940" y="313" fill="#050505" font-size="22" font-weight="700" text-anchor="middle">RootNavigationView</text>

      <rect x="770" y="362" width="340" height="60" rx="18" fill="#E6F2FF" stroke="#005EB8" stroke-width="2"/>
      <text x="940" y="399" fill="#005EB8" font-size="22" font-weight="700" text-anchor="middle">FeatureFactory</text>

      <rect x="770" y="448" width="340" height="82" rx="18" fill="#FAF9F6" stroke="#6E6E73" stroke-width="2"/>
      <text x="940" y="480" fill="#050505" font-size="20" font-weight="700" text-anchor="middle">View · ViewModel · UseCase</text>
      <text x="940" y="510" fill="#6E6E73" font-size="18" font-weight="600" text-anchor="middle">Repository · DataSource</text>
    </g>
  </g>
</svg>
