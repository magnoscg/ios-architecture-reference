name: iOS reference checks

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test and validate public content
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install lint tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install swiftformat swiftlint

      - name: Validate public boundaries and assets
        run: make validate

      - name: Lint without modifying sources
        run: make lint

      - name: Select an available iPhone simulator
        run: |
          simulator_id="$(python3 scripts/select_ios_simulator.py)"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Selected iPhone simulator: $simulator_id"

      - name: Build the Development app
        run: make build verify-bundle

      - name: Run the Swift Testing suite
        run: make test

      - name: Report test declarations
        run: ./scripts/count-swift-tests.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
